[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-mkv-gen-path-dt"
version = "0.1.0"
description = "Discrete-time path-dependent maximum-principle scenario generation model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
]

[project.optional-dependencies]
test = [
  "pytest",
]
faiss = [
  "faiss-cpu",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
